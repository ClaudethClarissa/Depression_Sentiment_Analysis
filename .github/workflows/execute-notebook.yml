name: Execute sentiment analysis notebook

on:
  push:
    paths:
      - '.github/workflows/execute-notebook.yml'
      - 'Sentiment_Analysis_Tw.ipynb'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific Python dependencies
        run: python -m pip install notebook nbconvert ipykernel numpy pandas scikit-learn matplotlib
      - name: Execute notebook and retain outputs
        env:
          MPLBACKEND: Agg
        run: |
          jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=900 Sentiment_Analysis_Tw.ipynb
      - name: Commit executed notebook with figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sentiment_Analysis_Tw.ipynb
          git diff --cached --quiet || (git commit -m "Save executed classification results and tree plots" && git push)
