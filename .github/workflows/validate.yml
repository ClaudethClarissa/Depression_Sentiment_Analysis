name: Validate NLP notebook
on:
  push:
    branches: [main, portfolio/research-readme]
  pull_request:
  workflow_dispatch:
jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy pandas matplotlib scipy scikit-learn nbclient nbformat ipykernel
      - name: Run corrected notebook
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          import nbformat
          from nbclient import NotebookClient
          nb = nbformat.read("Sentiment_Analysis_Tw.ipynb", as_version=4)
          NotebookClient(nb, timeout=600, kernel_name="python3", resources={"metadata":{"path":"."}}).execute()
          nbformat.write(nb, "executed.ipynb")
          for cell in nb.cells:
              for output in cell.get("outputs", []):
                  if output.output_type == "stream":
                      text = output.get("text", "")
                      if "accuracy:" in text or "Identical texts" in text or "n_grams" in text:
                          print(text)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: executed-notebook
          path: executed.ipynb
